        return NAN;
      }
      float volts = id(ha_battery_voltage).state;
      if (!(volts == volts)) {
        return NAN;
      }
      return volts;

  - platform: template
    name: "HA Battery SOC Read"
    id: ha_battery_soc_read
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (!id(ha_battery_soc).has_state()) {
        return NAN;
      }
      float soc = id(ha_battery_soc).state;
      if (!(soc == soc)) {
        return NAN;
      }
      return soc;

  - platform: template
    name: "HA Battery 2 SOC Read"
    id: ha_battery_2_soc_read
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      if (${ha_battery_2_enabled} == 0 || !id(ha_battery_2_soc).has_state()) {
        return NAN;
      }
      float soc = id(ha_battery_2_soc).state;
      if (!(soc == soc)) {
        return NAN;
      }
      return soc;

  - platform: template
    name: "HA Battery Power Filtered"
    id: ha_battery_power_filtered
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    lambda: |-
      return id(auto_batt_kw_filtered);
    update_interval: 5s
    on_value:
      then:
        - script.execute: sync_lcd_battery_gauge

  - platform: template
    name: "Active Target"
    id: active_target_kw
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      int mode = static_cast<int>(id(charger_mode).state + 0.5f);
      if (mode == 3) {
        return id(force_charge_target_kw).state;
      }
      return id(normal_charge_target_kw).state;
    update_interval: 1s

  - platform: adc
    pin: 7
    id: current_sensor_pin
    accuracy_decimals: 5
    attenuation: AUTO #0db
    #name: Current Sensor ADC
    entity_category: "diagnostic"

  - platform: ct_clamp
    sensor: current_sensor_pin
    name: "Current Measured"
    id: current_measured
    accuracy_decimals: 2
    sample_duration: 500ms
    update_interval: 2000ms
    filters: 
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - ${current_cal_0}
          - ${current_cal_1}
          - ${current_cal_2}
          - ${current_cal_3}
          - ${current_cal_4}
      - lambda: |-
          return x < 1.0f ? 0.0f : x;
  

  - platform: template
    name: Current Raw
    internal: True 
    accuracy_decimals: 5
    entity_category: "diagnostic"
    lambda: |-
        return id(current_measured).raw_state;
    update_interval: 1s

  - platform: adc
    pin: 6
    id: voltage_sensor_pin
    accuracy_decimals: 5
    attenuation: auto #0db
    #name: Voltage Sensor ADC
    entity_category: "diagnostic"

  - platform: ct_clamp #current sensor component can be used to measure voltage
    sensor: voltage_sensor_pin
    name: "Voltage"
    unit_of_measurement: V
    device_class: voltage
    id: voltage
    sample_duration: 500ms
    update_interval: 2000ms
    accuracy_decimals: 1
    filters: 
      - sliding_window_moving_average: 
          send_every: 1
          window_size: 30
      - calibrate_polynomial:
          degree: 2
          datapoints:
          - 0.0035 -> 0.0
          - 0.246 -> 118.5
          - 0.49437 -> 239.1

  - platform: template
    name: Voltage Raw
    internal: True
    accuracy_decimals: 5
    entity_category: "diagnostic"
    lambda: |-
        return id(voltage).raw_state;
    update_interval: 1s

  - platform: template
    name: Power
    id: power
    accuracy_decimals: 2
    device_class: power
    unit_of_measurement: kW
    lambda: |-
        return id(voltage).state * id(current_measured).state;
    update_interval: 1s
    filters: 
      - multiply: 0.001 # scale to kW
    on_value:
      then:
        - script.execute: sync_lcd_power_gauge


  - platform: total_daily_energy
    name: "Daily Energy"
    id: daily_energy
    power_id: power
    accuracy_decimals: 2
    on_value:
      then:
        - lvgl.label.update:
            id: daily_energy_label
            text:
              format: "%.2f"
              args: [ x ]
        - component.update: daily_percent
        - component.update: daily_cost

  - platform: template
    name: "Daily Percent"
    id: daily_percent
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      if (!id(daily_energy).has_state()) {
        return NAN;
      }
      float battery_kwh = id(car_battery_size_kwh).state;
      if (!(battery_kwh == battery_kwh) || battery_kwh <= 0.0f) {
        return NAN;
      }
      return (id(daily_energy).state / battery_kwh) * 100.0f;
    on_value:
      then:
        - lvgl.label.update:
            id: daily_percent_label
            text: !lambda |-
              if (!(x == x)) {
                return std::string("--");
              }
              return str_sprintf("%.1f", x);

  - platform: template
    name: "Daily Cost"
    id: daily_cost
    unit_of_measurement: "USD"
    device_class: monetary
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      if (!id(daily_energy).has_state()) {
        return NAN;
      }
      float usd_per_kwh = id(electricity_cost_per_kwh).state;
      if (!(usd_per_kwh == usd_per_kwh) || usd_per_kwh < 0.0f) {
        return NAN;
      }
      return id(daily_energy).state * usd_per_kwh;
    on_value:
      then:
        - lvgl.label.update:
            id: daily_cost_label
            text: !lambda |-
              if (!(x == x)) {
                return std::string("--");
              }
              return str_sprintf("%.2f", x);

  - platform: ntc
    sensor: ntc_resistance_sensor
    calibration:
      b_constant: 4460
      reference_temperature: 25°C
      reference_resistance: 10kOhm
    name: Temperature PCB

  - platform: resistance
    id: ntc_resistance_sensor
    sensor: ntc_sensor_pin
    configuration: DOWNSTREAM
    resistor: 5.6kOhm
    #name: NTC Resistance #for debugging only
    entity_category: "diagnostic"

  - platform: adc
    id: ntc_sensor_pin
    pin: 5
    #name: NTC ADC Pin #for debugging only
    accuracy_decimals: 5
    attenuation: auto #didnt seem to change anything
    entity_category: "diagnostic"
    
  - platform: template
    name: CP Output PWM Duty Cycle #for debugging only
    accuracy_decimals: 5
    id: cp_pwm_template
    entity_category: "diagnostic"
    on_value:
      then:
        - output.set_level:
            id: cp_pwm_pin
            level: !lambda 'return x;'
  
  - platform: adc
    pin: 9
    id: cp_sensor_pin
    name: CP ADC Pin #for debugging only
    accuracy_decimals: 5 #for display only
    attenuation: 12db #fixed attentuation - not sure if necessary
    update_interval: 1ms
    entity_category: "diagnostic"
    internal: true
    filters:
      - calibrate_polynomial: # convert raw values into actual voltage on the CP line - only for the high pwm cycle - any negative voltage below 0 will equal 0
          degree: 2
          datapoints:
          - 0 -> 0
          - 1.85 -> 5.66
          - 2.2 -> 9
          - 2.57 -> 12.56
    on_value:
      then:
        lambda: !lambda |-
          if (x > 3)
          {
            id(cp_sensor_high_average_v).publish_state(x);
          }
          else
          {
            id(cp_sensor_low_average_v).publish_state(x);
          }

  - platform: template
    name: CP High State Average Voltage
    internal: True
    accuracy_decimals: 5
    id: cp_sensor_high_average_v
    entity_category: "diagnostic"
    filters: 
      - sliding_window_moving_average: 
          send_every: 5
          window_size: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: |-
            auto *cp_controller = esphome::evse_cp::get_cp_controller();
            if (cp_controller != nullptr) {
              cp_controller->set_cp_high_voltage(x);
            }

  - platform: template
    name: CP Low State Average Voltage
    internal: True
    accuracy_decimals: 5
    id: cp_sensor_low_average_v
    entity_category: "diagnostic"
    filters: 
      - sliding_window_moving_average: 
          send_every: 5
          window_size: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: |-
            auto *cp_controller = esphome::evse_cp::get_cp_controller();
            if (cp_controller != nullptr) {
              cp_controller->set_cp_low_voltage(x);
            }

  - platform: internal_temperature
    name: "Temperature ESP32"
    id: temp_esp32

output:
  - platform: ledc # Duty cycle = amps / 0.6
    pin: 15
    id: cp_pwm_pin
    frequency: "1000Hz"

  - platform: ledc 
    pin: GPIO1
