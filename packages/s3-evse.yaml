#-------------------------------------------
# Touchscreen
#-------------------------------------------

i2c:
  sda: 4
  scl: 8
  id: touchscreen_bus

touchscreen:
  - platform: axs15231
    id: my_touchscreen
    display: my_display
    i2c_id: touchscreen_bus
    # Native panel coords (320x480). LVGL rotation 270 remaps these to landscape.
    # Do not swap/mirror here — that was only needed when rotation lived on the display.
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 480
    transform:
      swap_xy: false
      mirror_x: false
      mirror_y: false
    on_touch:
      - lambda: |-
          ESP_LOGI("cal", "x=%d, y=%d, x_raw=%d, y_raw=%0d",
            touch.x,
            touch.y,
            touch.x_raw,
            touch.y_raw
          );
          id(sync_lcd_mode_buttons).execute();

#-------------------------------------------
# Display axs15231 QSPI
#-------------------------------------------

spi:
  id: display_qspi
  type: quad
  clk_pin: 47
  data_pins: [21, 48, 40, 39]
  
display:
  - platform: qspi_dbi
    model: JC4832W535
    data_rate: 40MHz
    id: my_display
    spi_id: display_qspi
    dimensions:
      height: 480
      width: 320
    cs_pin:
      number: 45
      ignore_strapping_warning: true
    # Landscape is applied via lvgl.rotation (ESPHome 2026.x cannot rotate this display + LVGL together).
    #draw_from_origin: true
    #update_interval: never
    auto_clear_enabled: false
    #show_test_card: true # must enable update_interval, auto_clear_enable

# Main LVGL section
lvgl:
  rotation: 270
  displays:
    - my_display
  touchscreens:
    - my_touchscreen
  page_wrap: true
  theme:
    obj:
      border_width: 0
      pad_all: 0
      bg_color: 0
      text_color: white
      scrollable: false
#      outline_width: 1
#      outline_color: red
    label:
      border_width: 0
      scrollable: false
#      outline_width: 1
#      outline_color: red
    image:
      border_width: 0
      scrollable: false
#      outline_width: 1
#      outline_color: red
    button:
      text_font: $text_font
      scroll_on_focus: true
      radius: 10px
      shadow_width: 0 # This is required even though the default is supposed to be 0
      checked:
        bg_color: green
        text_color: white

# Main Page
# Landscape 480x320 version of the HA horseshoe dashboard card:
#   left  - flex-horseshoe style gauge (outer ring = charger power 0-11 kW,
#           inner ring = house battery net power -10..+10 kW, bidirectional from the top)
#           with NET / power / ADDED TODAY text inside and the charger state text
#           centred underneath
#   right - Stop / Normal / Fast mode buttons (mdi:power, mdi:lightning-bolt, mdi:flash)
  pages:
    - id: main_page
      height: 320
      width: 480
      text_font: $text_font
      scrollable: false
      text_color: white
      bg_color: 0
      bg_opa: COVER
      radius: 0
      pad_all: 5
      widgets:
        # ---------------------------------------------------------------
        # Gauge (left)
        # ---------------------------------------------------------------
        - obj:
            id: gauge_box
            align: TOP_LEFT
            x: 8
            y: 2
            width: 300
            height: 300
            bg_opa: TRANSP
            border_width: 0
            pad_all: 0
            scrollable: false
            widgets:
              # Outer ring: charger power (kW x 100), colour set by sync_lcd_power_gauge
              - arc:
                  id: power_arc
                  align: CENTER
                  width: 300
                  height: 300
                  pad_all: 0
                  min_value: 0
                  max_value: 1100
                  value: 0
                  start_angle: 135
                  end_angle: 45
                  mode: NORMAL
                  adjustable: false
                  arc_color: 0x303030
                  arc_width: 18
                  arc_rounded: false
                  indicator:
                    arc_color: 0x2E7D32
                    arc_width: 18
                    arc_rounded: false
                  knob:
                    bg_opa: 0%
              # Inner ring: house battery net power (kW x 100), green = charging, red = discharging
              - arc:
                  id: battery_arc
                  align: CENTER
                  width: 252
                  height: 252
                  pad_all: 0
                  min_value: -1000
                  max_value: 1000
                  value: 0
                  start_angle: 135
                  end_angle: 45
                  mode: SYMMETRICAL
                  adjustable: false
                  arc_opa: TRANSP
                  arc_width: 10
                  arc_rounded: false
                  indicator:
                    arc_color: 0x31FF00
                    arc_width: 10
                    arc_rounded: false
                  knob:
                    bg_opa: 0%

              # NET (house battery power)
              - label:
                  align: TOP_MID
                  y: 42
                  text: "NET"
                  text_font: roboto16
                  text_letter_space: 2
                  text_color: 0xC8C8C8
              - obj:
                  align: TOP_MID
                  y: 57
                  width: 180
                  height: 28
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: center
                    flex_align_cross: start
                    flex_align_track: start
                    pad_column: 2
                  widgets:
                    - label:
                        id: net_power_label
                        text: "--"
                        text_font: roboto22
                        text_color: 0xD0D0D0
                    - label:
                        text: "kW"
                        text_font: roboto14
                        text_color: 0xC8C8C8

              # Charger power (big number)
              - obj:
                  align: TOP_MID
                  y: 76
                  width: 290
                  height: 78
                  bg_opa: TRANSP
                  border_width: 0
                  pad_all: 0
                  scrollable: false
                  layout:
                    type: flex
                    flex_flow: row
                    flex_align_main: center
                    flex_align_cross: end
                    flex_align_track: start
                    pad_column: 6
                  widgets:
                    - label:
                        id: power_label
                        text: "0.00"
                        text_font: roboto64_num
                        text_color: 0xE6E6E6
                    - label:
                        text: "kW"
                        text_font: roboto22
                        text_color: 0xD0D0D0
                        pad_bottom: 10 # sit the unit on the baseline of the big digits

              # ADDED TODAY (values right-aligned to centre, units to the right)
              - label:
                  align: TOP_MID
                  y: 150
                  text: "ADDED TODAY"
                  text_font: roboto16
                  text_letter_space: 2
                  text_color: 0xC8C8C8
              - label:
                  id: daily_energy_label
                  align: TOP_MID
                  x: -53
                  y: 172
                  width: 110
                  text_align: RIGHT
                  text: "0.00"
                  text_font: roboto22
                  text_color: 0xD0D0D0
              - label:
                  align: TOP_MID
                  x: 44
                  y: 172
                  width: 60
                  text_align: LEFT
                  text: "kWh"
                  text_font: roboto22
                  text_color: 0xC8C8C8
              - label:
                  id: daily_cost_label
                  align: TOP_MID
                  x: -53
                  y: 200
                  width: 110
                  text_align: RIGHT
                  text: "0.00"
                  text_font: roboto22
