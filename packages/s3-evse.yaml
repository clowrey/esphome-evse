# Shared ESP32-S3 EVSE firmware for the Guition ESP32-S3-jc3248w535 board.
# A device file sets substitutions plus wifi, api, and ota.
# Control pilot handling is the evse_cp external component; this package wires it up.
# Hardware and CP approach inspired by https://github.com/dzurikmiroslav/esp32-evse

substitutions:
  name: "evse-0"
  device_description: "EVSE based on Guition ESP32-S3-jc3248w535 320px X 480px Dev Board"
  text_font: roboto18
  # Git ref of this repo that the device pulls packages and components from (branch or tag).
  firmware_ref: main
  # external_components source; a device file can point this at a local checkout (../esphome-evse/components).
  components_source: github://clowrey/esphome-evse@${firmware_ref}

  # House-battery power, signed: positive is charging the house battery, negative is discharging.
  # Up to two power entities are summed on the device (the second only when _2_enabled is 1), and an
  # optional fallback entity takes over when one of them stops updating. All share the divisor:
  # 1000 when the sensors are watts, 1 when they are already kilowatts.
  ha_battery_power_id: sensor.battery_power
  ha_battery_power_2_enabled: "0"
  ha_battery_power_2_id: sensor.battery_power
  ha_battery_power_fallback_enabled: "0"
  ha_battery_power_fallback_id: sensor.battery_power
  ha_battery_power_divisor: "1000.0"
  # Line voltage used to size the control steps when the EVSE's own voltage reading is not available.
  line_voltage_nominal: "230"
  ha_battery_voltage_id: sensor.battery_voltage
  ha_battery_soc_id: sensor.battery_state_of_charge
  # 0 ignores a second battery. Set to 1 and set ha_battery_2_soc_id to include it.
  # Charging uses the lower SOC of the batteries that are enabled.
  ha_battery_2_enabled: "0"
  ha_battery_2_soc_id: sensor.battery_2_state_of_charge

  # Raw CT reading -> amps. Replace these per installation.
  current_cal_0: "0.0160 -> 0.0"
  current_cal_1: "0.0641 -> 6.0"
  current_cal_2: "0.1054 -> 10.0"
  current_cal_3: "0.1721 -> 16.0"
  current_cal_4: "0.2147 -> 20.0"

  max_current_initial: "20"
  normal_setpoint_a: "6"
  fast_setpoint_a: "20"
  electricity_cost_initial: "0.55"
  car_battery_kwh_initial: "60.0"
  # 0 disables low-voltage lockout. Any positive value is the cutoff in volts.
  battery_low_voltage_cutoff_initial: "47"

packages:
  board: !include s3/board.yaml
  cp_pilot: !include s3/cp-pilot.yaml
  metering: !include s3/metering.yaml
  charge_control: !include s3/charge-control.yaml
  lcd: !include s3/lcd.yaml
