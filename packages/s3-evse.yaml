switch:
  - platform: template
    name: "Debug Error Mode"
    id: debug_error
    optimistic: true

  - platform: gpio
    pin: 14
    id: relay
    on_turn_on:
      - binary_sensor.template.publish:
          id: template_relay
          state: ON
    on_turn_off:
      - binary_sensor.template.publish:
          id: template_relay
          state: OFF

  - platform: template
    name: Auto Mode
    id: auto_mode
    internal: true
    optimistic: true
    on_turn_on:
      - lambda: |-
          if (millis() < 5000) {
            return;
          }
          id(event_ha_auto_mode_on).execute();
    on_turn_off:
      - lambda: |-
          if (millis() < 5000) {
            return;
          }
          id(event_ha_auto_mode_off).execute();

  - platform: template
    name: Charger Enabled
    id: charger_enabled
    icon: mdi:power
    lambda: |-
      int mode = static_cast<int>(id(charger_mode).state + 0.5f);
      return mode > 0;
    turn_on_action:
      - lambda: |-
          float cutoff_v = id(battery_low_voltage_cutoff).state;
          if (!(cutoff_v == cutoff_v)) {
            cutoff_v = 47.0f;
          }
          if (cutoff_v <= 0.0f) {
            id(low_voltage_lockout) = false;
            id(low_voltage_below_seconds) = 0;
          }

          bool lockout_cleared = false;
          if (id(low_voltage_lockout)) {
            if (!id(ha_battery_voltage).has_state()) {
              id(event_flag).publish_state("lockout clear blocked (no batt voltage)");
              return;
            }
            float batt_v = id(ha_battery_voltage).state;
            if (!(batt_v == batt_v)) {
              id(event_flag).publish_state("lockout clear blocked (invalid batt voltage)");
              return;
            }
            if (batt_v <= cutoff_v) {
              id(low_voltage_trigger_voltage) = batt_v;
              id(event_low_voltage_cutoff).execute();
              return;
            }
            id(low_voltage_lockout) = false;
            id(low_voltage_below_seconds) = 0;
            lockout_cleared = true;
          }

          int current_mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (current_mode > 0) {
            if (lockout_cleared && !id(enable).state) {
              id(internal_enable_change_last_ms) = millis();
              id(enable).turn_on();
            }
            return;
          }
          int target_mode = 2;
          if (id(charge_profile).current_option() == "Fast") {
            target_mode = 3;
          }
          auto mode_call = id(charger_mode).make_call();
          mode_call.set_value(target_mode);
          mode_call.perform();
    turn_off_action:
      - lambda: |-
          int current_mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (current_mode == 0) {
            return;
          }
          auto mode_call = id(charger_mode).make_call();
          mode_call.set_value(0);
          mode_call.perform();

  - platform: template
    name: Enable
    id: enable
    internal: true
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: |-
          if (!id(low_voltage_lockout)) {
            return;
          }
          float cutoff_v = id(battery_low_voltage_cutoff).state;
          if (!(cutoff_v == cutoff_v)) {
            cutoff_v = 47.0f;
          }
          if (cutoff_v <= 0.0f) {
            id(low_voltage_lockout) = false;
            id(low_voltage_below_seconds) = 0;
            return;
          }
          if (!id(ha_battery_voltage).has_state()) {
            id(internal_enable_change_last_ms) = millis();
            id(enable).turn_off();
            ESP_LOGW("battery_protect", "Enable blocked: voltage sensor unavailable while lockout active");
            return;
          }
          if (id(ha_battery_voltage).state <= cutoff_v) {
            id(low_voltage_trigger_voltage) = id(ha_battery_voltage).state;
            id(event_low_voltage_cutoff).execute();
            id(internal_enable_change_last_ms) = millis();
            id(enable).turn_off();
            ESP_LOGW("battery_protect", "Enable blocked: %.2fV <= %.2fV", id(ha_battery_voltage).state, cutoff_v);
            return;
          }
          id(low_voltage_lockout) = false;
          id(low_voltage_below_seconds) = 0;
      - lambda: |-
          if (!id(enable).state || millis() < 5000) {
            return;
          }
          uint32_t now = millis();
          if ((now - id(internal_enable_change_last_ms)) < 1500) {
            return;
          }
          id(event_ha_enable_on).execute();
    on_turn_off:
      - lambda: |-
          if (millis() < 5000) {
            return;
          }
          uint32_t now = millis();
          if ((now - id(internal_enable_change_last_ms)) < 1500) {
            return;
          }
          id(event_ha_enable_off).execute();

