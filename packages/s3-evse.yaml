# Shared ESP32-S3 EVSE firmware for the Guition ESP32-S3-jc3248w535 board.
# A device file sets substitutions plus wifi, api, and ota.
# Control pilot handling is the evse_cp external component; this package wires it up.
# Hardware and CP approach inspired by https://github.com/dzurikmiroslav/esp32-evse

substitutions:
  name: "evse-0"
  device_description: "EVSE based on Guition ESP32-S3-jc3248w535 320px X 480px Dev Board"
  icon_font: roboto18
  text_font: roboto18

  # Signed power: positive is charging the house battery, negative is discharging.
  # Divide by 1000 when the sensor is watts, or by 1 when it is already kilowatts.
  ha_battery_power_id: sensor.battery_power
  ha_battery_power_divisor: "1000.0"
  ha_battery_voltage_id: sensor.battery_voltage
  ha_battery_soc_id: sensor.battery_state_of_charge
  # 0 ignores a second battery. Set to 1 and set ha_battery_2_soc_id to include it.
  # Charging uses the lower SOC of the batteries that are enabled.
  ha_battery_2_enabled: "0"
  ha_battery_2_soc_id: sensor.battery_2_state_of_charge

  # Raw CT reading -> amps. Replace these per installation.
  current_cal_0: "0.0160 -> 0.0"
  current_cal_1: "0.0641 -> 6.0"
  current_cal_2: "0.1054 -> 10.0"
  current_cal_3: "0.1721 -> 16.0"
  current_cal_4: "0.2147 -> 20.0"

  max_current_initial: "20"
  normal_setpoint_a: "6"
  fast_setpoint_a: "20"
  electricity_cost_initial: "0.55"
  car_battery_kwh_initial: "60.0"
  # 0 disables low-voltage lockout. Any positive value is the cutoff in volts.
  battery_low_voltage_cutoff_initial: "47"

esphome:
  name: "${name}"
  comment: "${device_description}"
  min_version: 2024.11.0
  on_boot:
    priority: -100
    then:
      - lambda: |-
          auto *cp_controller = new esphome::evse_cp::EvseCpController(100);
          cp_controller->set_cp_pwm_output(id(cp_pwm_pin));
          cp_controller->set_cp_pwm_sensor(id(cp_pwm_template));
          cp_controller->set_cp_state_number(id(cp_state_machine));
          cp_controller->set_current_setpoint_number(id(current_setpoint));
          cp_controller->set_enable_switch(id(enable));
          cp_controller->set_debug_error_switch(id(debug_error));
          cp_controller->set_relay_switch(id(relay));
          esphome::evse_cp::set_cp_controller(cp_controller);
          cp_controller->setup();
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"
      - script.execute: apply_charger_mode
      - script.execute: apply_backlight_day_night

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      COMPILER_OPTIMIZATION_SIZE: y
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

preferences:
  flash_write_interval: 1min

external_components:
  - source: github://clowrey/esphome-evse
    components: [evse_cp]
    refresh: 0s

evse_cp:

# axs15231 is built into ESPHome 2026.7; the old PR overlay no longer compiles.

psram:
  mode: octal
  speed: 80MHz #cant go faster than 80 will revert to 40

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

wifi:
  reboot_timeout: 0s #disable automatic reboot if no wifi - Defaults to 15min - Does not apply when in access point mode.

web_server:
  port: 80
  version: 3

api:
  reboot_timeout: 0s #disable automatic when no HA connection - Defaults to 15 min

globals:
  - id: auto_batt_kw_filtered
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: auto_filter_initialized
    type: bool
    restore_value: no
    initial_value: "false"

  - id: auto_discharge_samples
    type: int
    restore_value: no
    initial_value: "0"

  - id: auto_surplus_samples
    type: int
    restore_value: no
    initial_value: "0"

  - id: auto_reenable_surplus_samples
    type: int
    restore_value: no
    initial_value: "0"

  - id: auto_last_step_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: auto_paused_low_pv
    type: bool
    restore_value: no
    initial_value: "false"

  - id: auto_paused_low_soc
    type: bool
    restore_value: no
    initial_value: "false"

  - id: low_voltage_lockout
    type: bool
    restore_value: yes
    initial_value: "false"

  - id: low_voltage_below_seconds
    type: int
    restore_value: no
    initial_value: "0"

  - id: low_voltage_trigger_voltage
    type: float
    restore_value: no
    initial_value: "0.0"

  - id: internal_enable_change_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: auto_current_change_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: internal_current_change_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: auto_soc_limiter_active
    type: bool
    restore_value: no
    initial_value: "false"

interval:
  - interval: 100ms
    then:
      - lambda: |-
          auto *cp_controller = esphome::evse_cp::get_cp_controller();
          if (cp_controller != nullptr) {
            cp_controller->update();
          }
  - interval: 1s
    then:
      - lambda: |-
          float cutoff_v = id(battery_low_voltage_cutoff).state;
          if (!(cutoff_v == cutoff_v)) {
            cutoff_v = 47.0f;
          }
          if (cutoff_v <= 0.0f) {
            id(low_voltage_below_seconds) = 0;
            id(low_voltage_lockout) = false;
            return;
          }
          if (!id(ha_battery_voltage).has_state()) {
            id(low_voltage_below_seconds) = 0;
            return;
          }
          float batt_v = id(ha_battery_voltage).state;
          if (!(batt_v == batt_v)) {
            id(low_voltage_below_seconds) = 0;
            return;
          }
          if (batt_v <= cutoff_v) {
            id(low_voltage_below_seconds) += 1;
          } else {
            id(low_voltage_below_seconds) = 0;
          }

          if (id(low_voltage_below_seconds) >= 30) {
            if (!id(low_voltage_lockout)) {
              id(low_voltage_trigger_voltage) = batt_v;
              id(event_low_voltage_cutoff).execute();
            }
            id(low_voltage_lockout) = true;
            if (id(enable).state) {
              id(internal_enable_change_last_ms) = millis();
              id(enable).turn_off();
              ESP_LOGW("battery_protect", "Low-voltage lockout after 30s: %.2fV <= %.2fV, charger disabled", batt_v, cutoff_v);
            }
          }
  - interval: 5s
    then:
      - lambda: |-
          id(sync_lcd_battery_gauge).execute();
          int mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (mode < 2 || mode > 3) {
            id(auto_discharge_samples) = 0;
            id(auto_surplus_samples) = 0;
            id(auto_reenable_surplus_samples) = 0;
            id(auto_paused_low_pv) = false;
            id(auto_paused_low_soc) = false;
            id(auto_soc_limiter_active) = false;
            return;
          }
          bool auto_no_minimum = (mode == 3);

          if (id(low_voltage_lockout)) {
            return;
          }

          // Stop charging at or below the house-battery minimum SOC.
          // With two batteries, the lower SOC is the one that counts.
          // The 10% window above that target only reduces current; it does not stop.
          bool has_house_soc = false;
          float house_soc = 100.0f;
          if (id(ha_battery_soc).has_state()) {
            float raw = id(ha_battery_soc).state;
            if (raw == raw) {
              house_soc = std::clamp(raw, 0.0f, 100.0f);
              has_house_soc = true;
            }
          }
          if (${ha_battery_2_enabled} != 0 && id(ha_battery_2_soc).has_state()) {
            float raw = id(ha_battery_2_soc).state;
            if (raw == raw) {
              raw = std::clamp(raw, 0.0f, 100.0f);
              if (!has_house_soc || raw < house_soc) {
                house_soc = raw;
              }
              has_house_soc = true;
            }
          }
          if (has_house_soc) {
            float min_soc_stop = id(battery_target_min_soc).state;
            if (!(min_soc_stop == min_soc_stop)) {
              min_soc_stop = 20.0f;
            }
            min_soc_stop = std::clamp(min_soc_stop, 0.0f, 100.0f);
            const float soc_resume = std::min(100.0f, min_soc_stop + 1.0f);

            if (house_soc <= min_soc_stop) {
              id(auto_paused_low_soc) = true;
              if (id(enable).state) {
                id(internal_enable_change_last_ms) = millis();
                id(enable).turn_off();
                id(event_flag).publish_state("paused low soc");
                ESP_LOGW("battery_protect", "Paused charging: house SOC %.1f%% <= %.1f%%", house_soc, min_soc_stop);
              }
              return;
            }

            if (id(auto_paused_low_soc)) {
              if (house_soc < soc_resume) {
                if (id(enable).state) {
                  id(internal_enable_change_last_ms) = millis();
                  id(enable).turn_off();
                }
                return;
              }
              id(auto_paused_low_soc) = false;
              if (!id(enable).state) {
                id(internal_enable_change_last_ms) = millis();
                id(enable).turn_on();
                id(event_flag).publish_state("resumed soc");
                ESP_LOGI("battery_protect", "Resumed charging: house SOC %.1f%% >= %.1f%%", house_soc, soc_resume);
              }
            }
          }

          if (!id(ha_battery_power).has_state()) {
            return;
          }

          const float raw_batt_kw = id(ha_battery_power).state / ${ha_battery_power_divisor};  // +charge, -discharge
          float alpha = id(auto_filter_alpha).state;
          if (!(alpha == alpha) || alpha <= 0.0f) {
            alpha = 0.30f;
          } else if (alpha > 1.0f) {
            alpha = 1.0f;
          }
          if (!id(auto_filter_initialized)) {
            id(auto_batt_kw_filtered) = raw_batt_kw;
            id(auto_filter_initialized) = true;
          } else {
            id(auto_batt_kw_filtered) =
                (alpha * raw_batt_kw) + ((1.0f - alpha) * id(auto_batt_kw_filtered));
          }

          bool force_charge = (mode == 3);
          float battery_target_kw = force_charge ? id(force_charge_target_kw).state
                                                 : id(normal_charge_target_kw).state;
          if (!(battery_target_kw == battery_target_kw)) {
            battery_target_kw = force_charge ? -3.0f : -1.0f;
          }
          // Battery power is signed: +charge, -discharge. Keep target at or below this value.
          if (battery_target_kw > 0.0f) {
            battery_target_kw = -battery_target_kw;
          }
          const float discharge_limit_kw = -battery_target_kw;
          float heavy_margin_kw = id(auto_heavy_discharge_margin_kw).state;
          if (!(heavy_margin_kw == heavy_margin_kw) || heavy_margin_kw < 0.0f) {
            heavy_margin_kw = 0.30f;
          }
          float gentle_surplus_kw = id(auto_gentle_surplus_kw).state;
          if (!(gentle_surplus_kw == gentle_surplus_kw)) {
            gentle_surplus_kw = 0.20f;
          }
          float strong_surplus_kw = id(auto_strong_surplus_kw).state;
          if (!(strong_surplus_kw == strong_surplus_kw)) {
            strong_surplus_kw = 1.80f;
          }
          const float discharge_kw = id(auto_batt_kw_filtered) < 0.0f ? -id(auto_batt_kw_filtered) : 0.0f;
          const uint32_t now = millis();
          int cooldown_s = static_cast<int>(id(auto_step_cooldown_s).state + 0.5f);
          if (cooldown_s < 1) {
            cooldown_s = 12;
          }
          const uint32_t step_cooldown_ms = static_cast<uint32_t>(cooldown_s * 1000);

          int reduce_samples = static_cast<int>(id(auto_reduce_samples).state + 0.5f);
          if (reduce_samples < 1) {
            reduce_samples = 2;
          }
          int increase_samples = static_cast<int>(id(auto_increase_samples).state + 0.5f);
          if (increase_samples < 1) {
            increase_samples = 4;
          }
          int pause_samples = static_cast<int>(id(auto_pause_samples).state + 0.5f);
          if (pause_samples < 1) {
            pause_samples = 12;
          }
          int resume_samples = static_cast<int>(id(auto_resume_samples).state + 0.5f);
          if (resume_samples < 1) {
            resume_samples = 18;
          }

          // 0 idle, 1 EV connected, 2 charging, 3 vent, 4 error.
          // Do not move the offered current while no vehicle is connected.
          int cp_state = static_cast<int>(id(cp_state_machine).state + 0.5f);
          if (cp_state != 1 && cp_state != 2) {
            id(auto_discharge_samples) = 0;
            id(auto_surplus_samples) = 0;
            id(auto_reenable_surplus_samples) = 0;
            return;
          }

          if (discharge_kw > discharge_limit_kw) {
            id(auto_discharge_samples) += 1;
          } else {
            id(auto_discharge_samples) = 0;
          }

          // Normal mode ramps up only on positive battery charging surplus.
          // Fast mode ramps up while discharge remains below the fast target.
          const float fast_ramp_hysteresis_kw = 0.10f;
          bool allow_increase_step = false;
          if (force_charge) {
            allow_increase_step = discharge_kw < (discharge_limit_kw - fast_ramp_hysteresis_kw);
          } else {
            allow_increase_step = id(auto_batt_kw_filtered) > gentle_surplus_kw;
          }

          if (allow_increase_step) {
            id(auto_surplus_samples) += 1;
          } else {
            id(auto_surplus_samples) = 0;
          }

          if (id(auto_batt_kw_filtered) > strong_surplus_kw) {
            id(auto_reenable_surplus_samples) += 1;
          } else {
            id(auto_reenable_surplus_samples) = 0;
          }

          float setpoint = id(current_setpoint).state;
          if (!(setpoint == setpoint)) {
            setpoint = 6.0f;
          }
          int setpoint_a = static_cast<int>(setpoint + 0.5f);

          if (auto_no_minimum) {
            // If already at minimum current and battery keeps discharging, pause charging.
            if (setpoint_a <= 6 && id(auto_discharge_samples) >= pause_samples) {
              if (id(enable).state) {
                id(internal_enable_change_last_ms) = millis();
                id(enable).turn_off();
                id(auto_paused_low_pv) = true;
                id(event_auto_enable_off).execute();
                ESP_LOGI("pv_auto", "Paused charging: battery discharge %.2f kW", discharge_kw);
              }
            }

            // Auto-resume only after sustained strong surplus.
            if (id(auto_paused_low_pv) && !id(enable).state) {
              if (id(auto_reenable_surplus_samples) >= resume_samples) {
                id(internal_enable_change_last_ms) = millis();
                id(enable).turn_on();
                id(auto_paused_low_pv) = false;
                id(event_auto_enable_on).execute();
                id(auto_discharge_samples) = 0;
                id(auto_last_step_ms) = now;
                ESP_LOGI("pv_auto", "Resumed charging: filtered battery %.2f kW", id(auto_batt_kw_filtered));
              }
              return;
            }
          } else {
            id(auto_paused_low_pv) = false;
          }

          if (!id(enable).state) {
            return;
          }

          if ((now - id(auto_last_step_ms)) < step_cooldown_ms) {
            return;
          }

          int delta_a = 0;
          if (discharge_kw > (discharge_limit_kw + heavy_margin_kw) && id(auto_discharge_samples) >= reduce_samples) {
            delta_a = -2;
          } else if (discharge_kw > discharge_limit_kw && id(auto_discharge_samples) >= reduce_samples) {
            delta_a = -1;
          } else if (id(auto_surplus_samples) >= increase_samples) {
            delta_a = 1;
          }

          float max_limit = id(max_current_limit).state;
          if (!(max_limit == max_limit)) {
            max_limit = 40.0f;
          }
          int max_limit_a = static_cast<int>(max_limit + 0.5f);
          if (max_limit_a < 6) {
            max_limit_a = 6;
          } else if (max_limit_a > 40) {
            max_limit_a = 40;
          }

          int soc_limit_a = max_limit_a;
          if (has_house_soc) {
            float soc = house_soc;
              float min_soc_target = id(battery_target_min_soc).state;
              if (!(min_soc_target == min_soc_target)) {
                min_soc_target = 20.0f;
              }
              min_soc_target = std::clamp(min_soc_target, 0.0f, 100.0f);
              const float ramp_window_soc = 10.0f;
              const float ramp_start_soc = std::min(100.0f, min_soc_target + ramp_window_soc);
              const float release_soc = std::min(100.0f, ramp_start_soc + 1.0f);  // 1% hysteresis

              if (!id(auto_soc_limiter_active)) {
                if (soc <= ramp_start_soc) {
                  id(auto_soc_limiter_active) = true;
                }
              } else if (soc >= release_soc) {
                id(auto_soc_limiter_active) = false;
              }

              if (id(auto_soc_limiter_active)) {
                if (soc <= min_soc_target || ramp_start_soc <= min_soc_target) {
                  soc_limit_a = 6;
                } else {
                  float ramp_ratio = (soc - min_soc_target) / (ramp_start_soc - min_soc_target);
                  ramp_ratio = std::clamp(ramp_ratio, 0.0f, 1.0f);
                  soc_limit_a = 6 + static_cast<int>(roundf(ramp_ratio * static_cast<float>(max_limit_a - 6)));
                  soc_limit_a = std::clamp(soc_limit_a, 6, max_limit_a);
                }
              }
          } else {
            id(auto_soc_limiter_active) = false;
          }

          if (setpoint_a > soc_limit_a) {
            int overshoot_a = setpoint_a - soc_limit_a;
            int soc_delta_a = (overshoot_a >= 2) ? -2 : -1;
            if (soc_delta_a < delta_a) {
              delta_a = soc_delta_a;
            }
          }

          if (delta_a == 0) {
            return;
          }

          int new_setpoint_a = setpoint_a + delta_a;
          if (new_setpoint_a < 6) {
            new_setpoint_a = 6;
          } else {
            if (new_setpoint_a > max_limit_a) {
              new_setpoint_a = max_limit_a;
            }
            if (new_setpoint_a > soc_limit_a) {
              new_setpoint_a = soc_limit_a;
            }
          }

          if (new_setpoint_a == setpoint_a) {
            return;
          }

          auto setpoint_call = id(current_setpoint).make_call();
          setpoint_call.set_value(new_setpoint_a);
          id(auto_current_change_last_ms) = now;
          setpoint_call.perform();
          char event_msg[40];
          snprintf(event_msg, sizeof(event_msg), "auto current set to %dA", new_setpoint_a);
          id(event_flag).publish_state(event_msg);
          id(event_auto_mode_change).execute();
          id(auto_last_step_ms) = now;

          ESP_LOGI("pv_auto", "Setpoint %dA -> %dA (battery %.2f kW)", setpoint_a, new_setpoint_a,
                   id(auto_batt_kw_filtered));

time:
  - platform: homeassistant
    id: system_time
    on_time_sync:
      - if: # Update the last restart time
          condition:
            lambda: 'return id(device_last_restart).state == "";'
          then:
            - text_sensor.template.publish:
                id: device_last_restart
                state: !lambda 'return id(system_time).now().strftime("%a %d %b %Y - %I:%M:%S %p");'
      - script.execute: apply_backlight_day_night
    on_time:
      - seconds: 0
        minutes: /5
        then:
          - script.execute: apply_backlight_day_night

text_sensor:
  - platform: wifi_info
    ip_address:
      name: IP Address

  - platform: template
    name: State Text Sensor Output
    id: state_text_sensor_output
    icon: mdi:information-outline
    update_interval: 1s
    lambda: |-
      int mode = static_cast<int>(id(charger_mode).state + 0.5f);
      float setpoint = id(current_setpoint).state;
      if (!(setpoint == setpoint)) {
        setpoint = 0.0f;
      }
      if (setpoint < 0.0f) {
        setpoint = 0.0f;
      }
      int setpoint_a = static_cast<int>(setpoint + 0.5f);
      float cutoff_v = id(battery_low_voltage_cutoff).state;
      if (!(cutoff_v == cutoff_v)) {
        cutoff_v = 47.0f;
      }
      bool lockout = id(low_voltage_lockout);
      bool enabled = id(enable).state;
      bool auto_paused = id(auto_paused_low_pv);
      bool batt_v_valid = id(ha_battery_voltage).has_state();
      float batt_v = batt_v_valid ? id(ha_battery_voltage).state : 0.0f;
      if (!(batt_v == batt_v)) {
        batt_v_valid = false;
        batt_v = 0.0f;
      }
      bool batt_above_cutoff = batt_v_valid && batt_v > cutoff_v;
      int below_seconds = id(low_voltage_below_seconds);
      if (below_seconds < 0) {
        below_seconds = 0;
      }

      if (mode <= 0) {
        if (lockout) {
          if (batt_above_cutoff) {
            return {"Stopped - LV lockout latched"};
          }
          return {"Stopped - LV lockout active"};
        }
        return {"Stopped"};
      }

      if (mode > 3) {
        return {"Unknown mode"};
      }

      if (mode == 1) {
        if (lockout) {
          if (batt_above_cutoff) {
            return {"Manual Stopped - LV lockout latched"};
          }
          return {"Manual Stopped - LV lockout active"};
        }
        if (!enabled) {
          if (below_seconds > 0 && batt_v_valid) {
            char msg[88];
            snprintf(msg, sizeof(msg), "Manual Stopped - LV guard %ds/30s (%.2fV)", below_seconds, batt_v);
            return {msg};
          }
          return {"Manual Stopped"};
        }
        if (setpoint_a <= 0) {
          return {"Manual Charging"};
        }
        char msg[48];
        snprintf(msg, sizeof(msg), "Manual Charging %dA", setpoint_a);
        return {msg};
      }

      const bool fast_mode = (mode == 3);
      const char *profile = fast_mode ? "Fast" : "Normal";

      if (lockout) {
        if (batt_above_cutoff) {
          char msg[72];
          snprintf(msg, sizeof(msg), "%s Paused - LV lockout latched", profile);
          return {msg};
        }
        char msg[70];
        snprintf(msg, sizeof(msg), "%s Paused - LV lockout active", profile);
        return {msg};
      }

      if (!enabled) {
        if (id(auto_paused_low_soc)) {
          float soc_now = 0.0f;
          bool has_soc = false;
          if (id(ha_battery_soc).has_state()) {
            float raw = id(ha_battery_soc).state;
            if (raw == raw) {
              soc_now = std::clamp(raw, 0.0f, 100.0f);
              has_soc = true;
            }
          }
          if (${ha_battery_2_enabled} != 0 && id(ha_battery_2_soc).has_state()) {
            float raw = id(ha_battery_2_soc).state;
            if (raw == raw) {
              raw = std::clamp(raw, 0.0f, 100.0f);
              if (!has_soc || raw < soc_now) {
                soc_now = raw;
              }
            }
          }
          char msg[72];
          snprintf(msg, sizeof(msg), "%s Paused - House SOC %.0f%%", profile, soc_now);
          return {msg};
        }
        if (auto_paused) {
          char msg[72];
          snprintf(msg, sizeof(msg), "%s Paused - Wait for PV surplus", profile);
          return {msg};
        }
        if (below_seconds > 0 && batt_v_valid) {
          char msg[94];
          snprintf(msg, sizeof(msg), "%s Paused - LV guard %ds/30s (%.2fV)", profile, below_seconds, batt_v);
          return {msg};
        }
        char msg[32];
        snprintf(msg, sizeof(msg), "%s Paused", profile);
        return {msg};
      }

      if (setpoint_a <= 6) {
        char msg[42];
        snprintf(msg, sizeof(msg), "%s Charging %dA (Min)", profile, setpoint_a);
        return {msg};
      }

      if (below_seconds > 0 && batt_v_valid) {
        char msg[92];
        snprintf(msg, sizeof(msg), "%s Charging %dA - LV guard %ds/30s (%.2fV)", profile, setpoint_a, below_seconds, batt_v);
        return {msg};
      }

      char msg[44];
      snprintf(msg, sizeof(msg), "%s Charging %dA", profile, setpoint_a);
      return {msg};
    on_value:
      then:
        - lvgl.label.update:
            id: label_machine_state
            text: !lambda 'return x;'

