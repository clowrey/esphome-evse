      if (!(batt_soc == batt_soc)) {
        has_soc = false;
        batt_soc = 0.0f;
      }

      char msg[220];
      snprintf(
          msg, sizeof(msg),
          "mode:%d en:%d lock:%d below:%ds cut:%.2fV trig:%.2fV V:%.2f(%s) P:%.0f(%s) SOC:%.1f(%s)",
          static_cast<int>(id(charger_mode).state + 0.5f),
          id(enable).state ? 1 : 0,
          id(low_voltage_lockout) ? 1 : 0,
          id(low_voltage_below_seconds),
          cutoff_v,
          id(low_voltage_trigger_voltage),
          batt_v,
          has_v ? "ok" : "na",
          batt_p_w,
          has_p ? "ok" : "na",
          batt_soc,
          has_soc ? "ok" : "na");
      return {msg};

script:
  - id: apply_backlight_day_night
    mode: restart
    then:
      - lambda: |-
          auto now = id(system_time).now();
          int day_start_hour = static_cast<int>(id(backlight_day_start_hour).state + 0.5f);
          int day_start_minute = static_cast<int>(id(backlight_day_start_minute).state + 0.5f);
          int night_start_hour = static_cast<int>(id(backlight_night_start_hour).state + 0.5f);
          int night_start_minute = static_cast<int>(id(backlight_night_start_minute).state + 0.5f);

          day_start_hour = std::clamp(day_start_hour, 0, 23);
          day_start_minute = std::clamp(day_start_minute, 0, 59);
          night_start_hour = std::clamp(night_start_hour, 0, 23);
          night_start_minute = std::clamp(night_start_minute, 0, 59);

          const int day_start_total = day_start_hour * 60 + day_start_minute;
          const int night_start_total = night_start_hour * 60 + night_start_minute;

          bool is_daytime = true;
          if (now.is_valid()) {
            const int now_total = now.hour * 60 + now.minute;
            if (day_start_total == night_start_total) {
              is_daytime = true;
            } else if (day_start_total < night_start_total) {
              is_daytime = (now_total >= day_start_total && now_total < night_start_total);
            } else {
              // Supports schedules that cross midnight.
              is_daytime = (now_total >= day_start_total || now_total < night_start_total);
            }
          }
          auto call = id(display_backlight).turn_on();
          call.set_brightness(is_daytime ? 1.0f : 0.5f);
          call.perform();

  - id: sync_lcd_power_gauge
    mode: restart
    then:
      - lambda: |-
          if (id(power_arc) == nullptr || id(power_label) == nullptr) {
            return;
          }
          // Outer ring: charger power 0..11 kW (same scale as the HA horseshoe card).
          const float max_kw = 11.0f;
          float kw = id(power).has_state() ? id(power).state : 0.0f;
          if (!(kw == kw) || kw < 0.0f) {
            kw = 0.0f;
          }
          const float arc_kw = std::min(kw, max_kw);
          lv_arc_set_value(id(power_arc), static_cast<int32_t>(roundf(arc_kw * 100.0f)));

          // HA "colorstop" style: use the colour of the highest stop at or below the value.
          uint32_t ring_color = 0x2E7D32;  // 0 kW   green
          if (kw >= 11.0f) {
            ring_color = 0xC62828;         // 11 kW  red
          } else if (kw >= 7.2f) {
            ring_color = 0xEF6C00;         // 7.2 kW orange
          } else if (kw >= 3.6f) {
            ring_color = 0xF9A825;         // 3.6 kW amber
          }
          lv_obj_set_style_arc_color(id(power_arc), lv_color_hex(ring_color), LV_PART_INDICATOR);
          lv_label_set_text(id(power_label), str_sprintf("%.2f", kw).c_str());

  - id: sync_lcd_battery_gauge
    mode: restart
    then:
      - lambda: |-
          if (id(battery_arc) == nullptr || id(net_power_label) == nullptr) {
            return;
          }
          // Inner ring: house battery net power, -10..+10 kW drawn from the top
          // (+ charging = green towards the right, - discharging = red towards the left).
          const float min_kw = -10.0f;
          const float max_kw = 10.0f;

          bool valid = false;
          float battery_kw = 0.0f;
          if (id(ha_battery_power).has_state()) {
            battery_kw = id(ha_battery_power).state / ${ha_battery_power_divisor};
            valid = true;
          } else if (id(ha_battery_power_filtered).has_state()) {
            battery_kw = id(ha_battery_power_filtered).state;
            valid = true;
          }
          if (!(battery_kw == battery_kw)) {
            battery_kw = 0.0f;
            valid = false;
          }

          const float arc_kw = std::clamp(battery_kw, min_kw, max_kw);
          lv_arc_set_value(id(battery_arc), static_cast<int32_t>(roundf(arc_kw * 100.0f)));
          const uint32_t ring_color = (battery_kw > 0.0f) ? 0x31FF00 : 0xFF1E1E;
          lv_obj_set_style_arc_color(id(battery_arc), lv_color_hex(ring_color), LV_PART_INDICATOR);

          if (valid) {
            lv_label_set_text(id(net_power_label), str_sprintf("%.2f", battery_kw).c_str());
          } else {
            lv_label_set_text(id(net_power_label), "--");
          }

  - id: sync_lcd_mode_buttons
    mode: restart
    then:
      - lambda: |-
          if (id(icon_mode_stop) == nullptr || id(icon_mode_normal) == nullptr || id(icon_mode_fast) == nullptr) {
            return;
          }
          int mode = static_cast<int>(id(charger_mode).state + 0.5f);

          // Same colours as the HA dashboard buttons; inactive icons are grey.
          const lv_color_t inactive = lv_color_hex(0x8A8A8A);
          lv_obj_set_style_text_color(id(icon_mode_stop), (mode == 0) ? lv_color_hex(0xFF5252) : inactive, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_mode_normal), (mode == 2) ? lv_color_hex(0x42D66A) : inactive, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_mode_fast), (mode == 3) ? lv_color_hex(0xFFB74D) : inactive, LV_PART_MAIN);

  - id: apply_charger_mode
    mode: restart
    then:
      - lambda: |-
          int mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (mode < 0) {
            mode = 0;
          } else if (mode > 3) {
            mode = 3;
          }

          if (mode == 0) {
            if (id(auto_mode).state) {
              id(auto_mode).turn_off();
            }
            if (id(enable).state) {
              id(internal_enable_change_last_ms) = millis();
              id(enable).turn_off();
            }
            return;
          }

          if (mode == 1) {
            if (id(auto_mode).state) {
              id(auto_mode).turn_off();
            }
            if (!id(enable).state && !id(low_voltage_lockout)) {
              id(internal_enable_change_last_ms) = millis();
              id(enable).turn_on();
            }
            return;
          }

          if (mode == 2 || mode == 3) {
            if (!id(auto_mode).state) {
              id(auto_mode).turn_on();
            }
            if (!id(enable).state && !id(low_voltage_lockout)) {
              id(internal_enable_change_last_ms) = millis();
              id(enable).turn_on();
            }
            return;
          }

          if (id(auto_mode).state) {
            id(auto_mode).turn_off();
          }
          if (!id(enable).state && !id(low_voltage_lockout)) {
            id(internal_enable_change_last_ms) = millis();
            id(enable).turn_on();
          }
      - script.execute: sync_lcd_mode_buttons

  - id: event_low_voltage_cutoff
    mode: restart
    then:
      - lambda: |-
          float cutoff_v = id(battery_low_voltage_cutoff).state;
          if (!(cutoff_v == cutoff_v)) {
            cutoff_v = 47.0f;
          }
          char event_msg[88];
          snprintf(event_msg, sizeof(event_msg), "low voltage cutoff %.2fV <= %.2fV for 30s", id(low_voltage_trigger_voltage), cutoff_v);
          id(event_flag).publish_state(event_msg);
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_auto_mode_change
    mode: restart
    then:
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_auto_enable_off
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "auto set enable off"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_auto_enable_on
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "auto set enable on"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_ha_enable_on
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "ha set enable on"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_ha_enable_off
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "ha set enable off"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_ha_auto_mode_on
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "ha set auto mode on"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_ha_auto_mode_off
    mode: restart
    then:
      - text_sensor.template.publish:
          id: event_flag
          state: "ha set auto mode off"
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

  - id: event_ha_current_set
    mode: restart
    then:
      - delay: 1s
      - text_sensor.template.publish:
          id: event_flag
          state: "idle"

