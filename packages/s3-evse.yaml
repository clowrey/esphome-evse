  - platform: template
    name: HA Inputs Debug
    id: ha_inputs_debug
    icon: mdi:clipboard-text-outline
    entity_category: diagnostic
    update_interval: 1s
    lambda: |-
      float cutoff_v = id(battery_low_voltage_cutoff).state;
      if (!(cutoff_v == cutoff_v)) {
