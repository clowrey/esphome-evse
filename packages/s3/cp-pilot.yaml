# J1772 control pilot: evse_cp component wiring, CP sensing, pilot PWM, relay and the offered current.
# Included by packages/s3-evse.yaml.

# The control-pilot state machine (components/evse_cp). It samples the CP line through the
# two average sensors below, drives the pilot PWM and the relay, and publishes cp_state_machine.
evse_cp:
  id: cp_controller
  update_interval: 100ms
  cp_pwm_output: cp_pwm_pin
  cp_pwm_sensor: cp_pwm_template
  cp_state_number: cp_state_machine
  current_setpoint: current_setpoint
  enable_switch: enable
  debug_error_switch: debug_error
  relay_switch: relay

text_sensor:
  - platform: template
    name: CP State
    id: text_cp_state
    on_value:
      then:
        - script.execute: sync_lcd_vehicle

number:
  - platform: template
    unit_of_measurement: A
    device_class: current
    name: Max Current Limit
    id: max_current_limit
    min_value: 6
    max_value: 40
    step: 1
    initial_value: ${max_current_initial}
    restore_value: true
    optimistic: True
    mode: BOX
    # The charge controller pulls Current Setpoint down to this limit on its next tick.

  - platform: template
    unit_of_measurement: A
    device_class: current
    name: Current Setpoint
    id: current_setpoint
    min_value: 6 #minimum allowed by the standard is 5A - initial testing showed 5A = 0A on Nissan Leaf - maybe needs better calibration
    max_value: 40 #set your max current here
    step: 1
    restore_value: true
    optimistic: True
    mode: BOX #display a box vs slider in the HA dashboard
    # A change made in Home Assistant or on the LCD is picked up by the charge controller
    # as the new starting point ("user set NA" event); it also enforces Max Current Limit.

  - platform: template
    id: cp_state_machine
    name: CP State Machine
    internal: true
    restore_value: False
    initial_value: 0
    min_value: 0
    max_value: 4
    step: 1
    optimistic: True
    entity_category: "diagnostic"
    on_value:
      lambda: !lambda |-
        int index = x;
        switch (index)
        {
          case 0:
            id(text_cp_state).publish_state("Idle");
            break;
          case 1:
            id(text_cp_state).publish_state("EV Connected");
            break;
          case 2:
            id(text_cp_state).publish_state("EV Charging");
            break;
          case 3:
            id(text_cp_state).publish_state("EV Vent");
            break;
          case 4:
            id(text_cp_state).publish_state("Error");
            break;
        }

sensor:
  - platform: template
    name: CP Output PWM Duty Cycle #for debugging only
    accuracy_decimals: 5
    id: cp_pwm_template
    entity_category: "diagnostic"
    on_value:
      then:
        - output.set_level:
            id: cp_pwm_pin
            level: !lambda 'return x;'

  - platform: adc
    pin: 9
    id: cp_sensor_pin
    name: CP ADC Pin #for debugging only
    accuracy_decimals: 5 #for display only
    attenuation: 12db #fixed attentuation - not sure if necessary
    update_interval: 1ms
    entity_category: "diagnostic"
    internal: true
    filters:
      - calibrate_polynomial: # convert raw values into actual voltage on the CP line - only for the high pwm cycle - any negative voltage below 0 will equal 0
          degree: 2
          datapoints:
          - 0 -> 0
          - 1.85 -> 5.66
          - 2.2 -> 9
          - 2.57 -> 12.56
    on_value:
      then:
        lambda: !lambda |-
          if (x > 3)
          {
            id(cp_sensor_high_average_v).publish_state(x);
          }
          else
          {
            id(cp_sensor_low_average_v).publish_state(x);
          }

  - platform: template
    name: CP High State Average Voltage
    internal: True
    accuracy_decimals: 5
    id: cp_sensor_high_average_v
    entity_category: "diagnostic"
    # Max, not average: at low duty, samples caught on a pilot edge read low and
    # averaged together they can look like State D.
    filters:
      - max:
          send_every: 5
          window_size: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: |-
            id(cp_controller)->set_cp_high_voltage(x);

  - platform: template
    name: CP Low State Average Voltage
    internal: True
    accuracy_decimals: 5
    id: cp_sensor_low_average_v
    entity_category: "diagnostic"
    filters: 
      - sliding_window_moving_average: 
          send_every: 5
          window_size: 5
          send_first_at: 5
    on_value:
      then:
        - lambda: |-
            id(cp_controller)->set_cp_low_voltage(x);

output:
  - platform: ledc # Duty cycle = amps / 0.6
    pin: 15
    id: cp_pwm_pin
    frequency: "1000Hz"

switch:
  - platform: template
    name: "Debug Error Mode"
    id: debug_error
    optimistic: true

  - platform: gpio
    pin: 14
    id: relay
    on_turn_on:
      - binary_sensor.template.publish:
          id: template_relay
          state: ON
    on_turn_off:
      - binary_sensor.template.publish:
          id: template_relay
          state: OFF

binary_sensor:
  - platform: template
    name: "AC Relay"
    id: template_relay

button:
  - platform: template
    name: Set 6A
    icon: "mdi:emoticon-outline"
    on_press:
      - number.set:
          id: current_setpoint
          value: 6
