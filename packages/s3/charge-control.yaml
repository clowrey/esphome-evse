# Charge control: house-battery inputs from Home Assistant, the Normal/Fast controller
# (components/evse_charge_control), SOC and low-voltage protection, mode entities and status text.
# Included by packages/s3-evse.yaml.
#
# Charger Mode: 0 Stop, 1 Manual, 2 Normal, 3 Fast.
# Normal and Fast hold the house-battery power at their target (kW, negative = discharging)
# by stepping Current Setpoint between 6 A and Max Current Limit.

sensor:
  # House-battery power inputs, signed: positive is charging the house battery.
  # Summed on the device; a stale or unavailable input switches to the fallback.
  - platform: homeassistant
    id: ha_battery_power_1
    entity_id: ${ha_battery_power_id}
    internal: true

  - platform: homeassistant
    id: ha_battery_power_2
    entity_id: ${ha_battery_power_2_id}
    internal: true

  - platform: homeassistant
    id: ha_battery_power_fallback
    entity_id: ${ha_battery_power_fallback_id}
    internal: true

  - platform: homeassistant
    id: ha_battery_voltage
    entity_id: ${ha_battery_voltage_id}
    internal: true

  - platform: homeassistant
    id: ha_battery_soc
    entity_id: ${ha_battery_soc_id}
    internal: true

  - platform: homeassistant
    id: ha_battery_2_soc
    entity_id: ${ha_battery_2_soc_id}
    internal: true

  # Published by the controller: the summed battery power in kW, raw and filtered.
  - platform: template
    name: "HA Battery Power"
    id: ha_battery_power
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    filters:
      - throttle: 5s
      - delta: 0.05
    on_value:
      then:
        - script.execute: sync_lcd_battery_gauge

  - platform: template
    name: "HA Battery Power Filtered"
    id: ha_battery_power_filtered
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 3
    update_interval: never
    filters:
      - throttle: 5s
      - delta: 0.05

  - platform: template
    name: "Active Target"
    id: active_target_kw
    unit_of_measurement: "kW"
    device_class: power
    state_class: measurement
    accuracy_decimals: 2
    lambda: |-
      int mode = static_cast<int>(id(charger_mode).state + 0.5f);
      if (mode == 3) {
        return id(force_charge_target_kw).state;
      }
      return id(normal_charge_target_kw).state;
    update_interval: 10s
    filters:
      - delta: 0.01

text_sensor:
  - platform: template
    name: State Text Sensor Output
    id: state_text_sensor_output
    icon: mdi:information-outline
    update_interval: never
    on_value:
      then:
        - lvgl.label.update:
            id: label_machine_state
            text: !lambda 'return x;'

  # One line per controller event: "auto 20A -> 24A (-2.61 kW)", "user set 40A", "paused low pv ...".
  - platform: template
    name: Event Flag
    id: event_flag
    icon: mdi:flag
    entity_category: diagnostic

  # primary / fallback (input N stale Ns) / none
  - platform: template
    name: Battery Power Source
    id: battery_power_source
    icon: mdi:source-branch
    entity_category: diagnostic

  - platform: template
    name: HA Inputs Debug
    id: ha_inputs_debug
    icon: mdi:clipboard-text-outline
    entity_category: diagnostic
    update_interval: never

evse_charge_control:
  id: charge_ctl
  update_interval: 1s
  battery_power:
    - sensor: ha_battery_power_1
    - sensor: ha_battery_power_2
      enabled: ${ha_battery_power_2_enabled}
  battery_power_fallback:
    sensor: ha_battery_power_fallback
    enabled: ${ha_battery_power_fallback_enabled}
  power_divisor: ${ha_battery_power_divisor}
  battery_voltage: ha_battery_voltage
  battery_soc:
    - sensor: ha_battery_soc
    - sensor: ha_battery_2_soc
      enabled: ${ha_battery_2_enabled}
  line_voltage: voltage
  nominal_line_voltage: ${line_voltage_nominal}
  cp_state: cp_state_machine
  charger_mode: charger_mode
  current_setpoint: current_setpoint
  max_current_limit: max_current_limit
  enable_switch: enable
  params:
    normal_target: normal_charge_target_kw
    fast_target: force_charge_target_kw
    min_soc: battery_target_min_soc
    low_voltage_cutoff: battery_low_voltage_cutoff
    deadband: cc_deadband_kw
    gain: cc_gain
    max_step_up: cc_max_step_up_a
    max_step_down: cc_max_step_down_a
    settle_time: cc_settle_s
    settle_time_fallback: cc_settle_fallback_s
    evidence_samples: cc_evidence_samples
    filter_alpha: cc_filter_alpha
    pause_after: cc_pause_after_s
    resume_after: cc_resume_after_s
    resume_margin: cc_resume_margin_kw
    stale_time: cc_stale_s
    blind_timeout: cc_blind_timeout_s
  outputs:
    raw_power: ha_battery_power
    filtered_power: ha_battery_power_filtered
    state_text: state_text_sensor_output
    event: event_flag
    source: battery_power_source
    debug: ha_inputs_debug

select:
  - platform: template
    name: Charge Profile
    id: charge_profile
    options:
      - "Normal"
      - "Fast"
    initial_option: "Normal"
    restore_value: true
    optimistic: true
    set_action:
      - lambda: |-
          int mode = (x == "Fast") ? 3 : 2;
          auto mode_call = id(charger_mode).make_call();
          mode_call.set_value(mode);
          mode_call.perform();
      - script.execute: sync_lcd_mode_buttons

number:
  - platform: template
    name: Charger Mode
    id: charger_mode
    min_value: 0
    max_value: 3
    step: 1
    initial_value: 1
    restore_value: true
    optimistic: True
    mode: BOX
    on_value:
      then:
        - lambda: |-
            int mode = static_cast<int>(x + 0.5f);
            if (mode == 3) {
              id(charge_profile).publish_state("Fast");
            } else if (mode == 2) {
              id(charge_profile).publish_state("Normal");
            }
        - script.execute: sync_lcd_mode_buttons

  - platform: template
    unit_of_measurement: V
    device_class: voltage
    name: Battery Low Voltage Cutoff
    id: battery_low_voltage_cutoff
    min_value: 0
    max_value: 60
    step: 0.1
    initial_value: ${battery_low_voltage_cutoff_initial}
    restore_value: true
    optimistic: True
    mode: BOX

  # House-battery power the controller holds in Normal mode. Negative = discharging.
  - platform: template
    id: normal_charge_target_kw
    name: "Normal Target"
    unit_of_measurement: "kW"
    step: 0.05
    min_value: -5
    max_value: 2
    initial_value: -1.00
    restore_value: true
    optimistic: True
    mode: BOX

  - platform: template
    id: force_charge_target_kw
    name: "Fast Target"
    unit_of_measurement: "kW"
    step: 0.1
    min_value: -10
    max_value: 2
    initial_value: -3.00
    restore_value: true
    optimistic: True
    mode: BOX

  - platform: template
    id: battery_target_min_soc
    name: "Battery Target Min SOC"
    unit_of_measurement: "%"
    step: 1
    min_value: 5
    max_value: 95
    initial_value: 20
    restore_value: true
    optimistic: True
    mode: BOX

  # Controller tuning. Defaults suit sub-second battery power inputs; slow inputs
  # automatically extend the settle time to a few of their update intervals.
  - platform: template
    id: cc_deadband_kw
    name: "Charge Control Deadband"
    unit_of_measurement: "kW"
    step: 0.05
    min_value: 0.1
    max_value: 2
    initial_value: 0.25
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_gain
    name: "Charge Control Gain"
    step: 0.05
    min_value: 0.2
    max_value: 1.5
    initial_value: 0.8
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_max_step_up_a
    name: "Charge Control Max Step Up"
    unit_of_measurement: "A"
    step: 1
    min_value: 1
    max_value: 20
    initial_value: 4
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_max_step_down_a
    name: "Charge Control Max Step Down"
    unit_of_measurement: "A"
    step: 1
    min_value: 1
    max_value: 34
    initial_value: 8
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_settle_s
    name: "Charge Control Settle Time"
    unit_of_measurement: "s"
    step: 1
    min_value: 3
    max_value: 120
    initial_value: 8
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_settle_fallback_s
    name: "Charge Control Settle Time Fallback"
    unit_of_measurement: "s"
    step: 1
    min_value: 5
    max_value: 180
    initial_value: 40
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_evidence_samples
    name: "Charge Control Evidence Samples"
    step: 1
    min_value: 1
    max_value: 30
    initial_value: 3
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_filter_alpha
    name: "Charge Control Filter Alpha"
    step: 0.05
    min_value: 0.05
    max_value: 1
    initial_value: 0.5
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_pause_after_s
    name: "Charge Control Pause After"
    unit_of_measurement: "s"
    step: 5
    min_value: 10
    max_value: 600
    initial_value: 60
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_resume_after_s
    name: "Charge Control Resume After"
    unit_of_measurement: "s"
    step: 5
    min_value: 10
    max_value: 900
    initial_value: 60
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_resume_margin_kw
    name: "Charge Control Resume Margin"
    unit_of_measurement: "kW"
    step: 0.1
    min_value: 0
    max_value: 3
    initial_value: 0.5
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_stale_s
    name: "Charge Control Input Stale Time"
    unit_of_measurement: "s"
    step: 5
    min_value: 5
    max_value: 300
    initial_value: 30
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

  - platform: template
    id: cc_blind_timeout_s
    name: "Charge Control Blind Timeout"
    unit_of_measurement: "s"
    step: 30
    min_value: 0
    max_value: 1800
    initial_value: 600
    restore_value: true
    optimistic: True
    mode: BOX
    entity_category: config

switch:
  # On = any mode other than Stop. Turning on picks Normal or Fast from Charge Profile
  # and asks the controller to clear a low-voltage lockout if the battery voltage allows.
  # restore_mode DISABLED: the default ALWAYS_OFF ran turn_off_action at every boot, which put
  # Charger Mode back to Stop after any reboot. The state comes from the lambda (Charger Mode).
  - platform: template
    name: Charger Enabled
    id: charger_enabled
    icon: mdi:power
    restore_mode: DISABLED
    lambda: |-
      int mode = static_cast<int>(id(charger_mode).state + 0.5f);
      return mode > 0;
    turn_on_action:
      - lambda: |-
          id(charge_ctl)->request_lockout_clear();
          int current_mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (current_mode > 0) {
            return;
          }
          int target_mode = (id(charge_profile).current_option() == "Fast") ? 3 : 2;
          auto mode_call = id(charger_mode).make_call();
          mode_call.set_value(target_mode);
          mode_call.perform();
    turn_off_action:
      - lambda: |-
          int current_mode = static_cast<int>(id(charger_mode).state + 0.5f);
          if (current_mode == 0) {
            return;
          }
          auto mode_call = id(charger_mode).make_call();
          mode_call.set_value(0);
          mode_call.perform();

  # Driven by the controller only: off holds a steady +12 V pilot and opens the relay.
  - platform: template
    name: Enable
    id: enable
    internal: true
    optimistic: true
    restore_mode: ALWAYS_OFF

button:
  - platform: template
    name: "Stop"
    icon: mdi:power-off
    on_press:
      - number.set:
          id: charger_mode
          value: 0

  - platform: template
    name: Manual
    icon: mdi:hand-back-right-outline
    on_press:
      - number.set:
          id: charger_mode
          value: 1

  - platform: template
    name: Normal
    on_press:
      - select.set:
          id: charge_profile
          option: "Normal"

  - platform: template
    name: Fast
    on_press:
      - select.set:
          id: charge_profile
          option: "Fast"
