# Device config for the S3 EVSE. Shared firmware is packages/s3-evse.yaml.
# secrets.yaml needs wifi_ssid, wifi_password, ota_password, and api_encryption_key.
# Values marked first-boot are used once; later changes are saved on the device.

substitutions:
  # Hostname. Entity ids use this, with the hyphen as an underscore (evse-0 -> evse_0_).
  # Leave this as evse-0, evse-1, and so on if you will have more than one EVSE.
  # You can rename the device in Home Assistant afterward; that does not change the entity ids.
  name: "evse-0"
  # ESPHome device comment.
  device_description: "EVSE based on Guition ESP32-S3-jc3248w535 320px X 480px Dev Board"

  # House battery power, signed: +charging, -discharging.
  # Normal and Fast modes step the charge current from this sensor.
  ha_battery_power_id: sensor.battery_power
  # Divide the power sensor by this to get kW. 1000 for watts, 1 if the sensor is already kW.
  ha_battery_power_divisor: "1000.0"
  # House battery voltage. Charging locks out after 30s at or below the cutoff (47 V unless changed on the device).
  ha_battery_voltage_id: sensor.battery_voltage
  # House battery state of charge, percent. Current is reduced in the 10% above the minimum SOC.
  # At or below that minimum, Normal and Fast stop charging until SOC is 1% above it.
  # The lower SOC is used when a second battery is enabled.
  ha_battery_soc_id: sensor.battery_state_of_charge
  # 0 ignores a second battery. Set to 1 and set ha_battery_2_soc_id to include it.
  ha_battery_2_enabled: "0"
  ha_battery_2_soc_id: sensor.battery_2_state_of_charge

  # CT clamp calibration, raw reading -> amps.
  current_cal_0: "0.0160 -> 0.0"
  current_cal_1: "0.0641 -> 6.0"
  current_cal_2: "0.1054 -> 10.0"
  current_cal_3: "0.1721 -> 16.0"
  current_cal_4: "0.2147 -> 20.0"

  # First-boot Max Current Limit, amps. This is the ceiling, not the current offered to the car.
  # Current Setpoint is what the pilot advertises. Normal and Fast step it between 6 A and this ceiling.
  # 6 A is the floor: 5 A showed up as 0 A on a Leaf. After first boot, change Max Current Limit on the device.
  max_current_initial: "20"
  # LCD Normal button only: switch to Normal and set Current Setpoint to this many amps (the floor).
  # Auto then raises it when the house battery is charging and lowers it when discharge passes the Normal target.
  # The Home Assistant Normal button changes mode only and leaves the setpoint alone.
  normal_setpoint_a: "6"
  # LCD Fast button only: switch to Fast and jump Current Setpoint to this many amps.
  # Auto then moves it to hold discharge near the Fast target, still inside 6 A and Max Current Limit.
  # At 6 A, Fast pauses if the battery keeps discharging. The Home Assistant Fast button changes mode only.
  fast_setpoint_a: "20"
  # First-boot electricity price, USD per kWh, for the daily cost on the LCD.
  electricity_cost_initial: "0.55"
  # First-boot car battery size, kWh. Daily energy is also shown as a percent of this.
  car_battery_kwh_initial: "60.0"

packages:
  s3_evse:
    url: https://github.com/clowrey/esphome-evse.git
    ref: main
    files:
      - packages/s3-evse.yaml
    refresh: 0s

wifi:
  # From secrets.yaml. Add use_address when OTA should target an existing IP.
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

api:
  encryption:
    # Home Assistant API encryption key from secrets.yaml.
    key: !secret api_encryption_key
